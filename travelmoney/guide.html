    <style>
        /* Compact & Sleek Dashboard Layout */
        .guide-menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 6px;
            margin-bottom: 20px;
        }
        .guide-menu-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .guide-menu-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }
        .guide-menu-card.active {
            background: var(--primary-gradient);
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .guide-menu-card .icon {
            font-size: 1rem;
        }
        .guide-menu-card .title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
        }
        .guide-menu-card.active .title {
            color: #ffffff;
        }
        .guide-detail-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        .guide-section-block {
            margin-bottom: 18px;
        }
        .guide-section-title {
            font-size: 0.92rem;
            font-weight: 800;
            color: #60a5fa;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .guide-item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .guide-item-row {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
        }
        .guide-item-row h4 {
            font-size: 0.85rem;
            color: var(--text-primary);
            margin-bottom: 3px;
            font-weight: 700;
        }
        .guide-item-row p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.45;
        }
        .guide-tip-box {
            margin-top: 16px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .guide-tip-box span {
            font-size: 0.95rem;
        }
        .guide-tip-box p {
            font-size: 0.8rem;
            color: #93c5fd;
            line-height: 1.45;
        }
    </style>
</head>

        function renderGuideDetail() {
            const container = document.getElementById('guide-detail-content');
            if (!container) return;

            const dict = guideData[currentLang] || guideData.ko;
            const item = dict[currentGuideId] || dict[1];

            let viewsHtml = '';
            item.views.forEach(v => {
                viewsHtml += `
                    <div class="guide-item-row">
                        <h4>🔹 ${v.title}</h4>
                        <p>${v.desc}</p>
                    </div>
                `;
            });

            let actionsHtml = '';
            item.actions.forEach(a => {
                actionsHtml += `
                    <div class="guide-item-row">
                        <h4>⚡ ${a.title}</h4>
                        <p>${a.desc}</p>
                    </div>
                `;
            });

            container.innerHTML = `
                <h2 style="font-size: 1.15rem; font-weight: 800; color: #60a5fa; margin-bottom: 14px;">${item.title}</h2>

                <div class="guide-section-block">
                    <div class="guide-section-title">${item.viewText}</div>
                    <div class="guide-item-list">
                        ${viewsHtml}
                    </div>
                </div>

                <div class="guide-section-block" style="margin-top: 16px;">
                    <div class="guide-section-title">${item.actionText}</div>
                    <div class="guide-item-list">
                        ${actionsHtml}
                    </div>
                </div>

                <div class="guide-tip-box">
                    <span>💡</span>
                    <p>${item.tip}</p>
                </div>
            `;
        }

        function setGuideLanguage(lang) {
            currentLang = (lang === 'ja' || lang === 'jp') ? 'ja' : (lang === 'en' ? 'en' : 'ko');
            localStorage.setItem('guide_lang', currentLang);

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang || (btn.dataset.lang === 'ja' && currentLang === 'ja'));
            });

            const catDict = categoryDict[currentLang] || categoryDict.ko;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (catDict[key]) {
                    el.textContent = catDict[key];
                }
            });

            renderGuideDetail();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            const targetLang = (urlLang === 'ja' || urlLang === 'jp') ? 'ja' : (urlLang === 'en' ? 'en' : (urlLang === 'ko' ? 'ko' : null));
            const navLang = navigator.language.startsWith('ja') ? 'ja' : (navigator.language.startsWith('en') ? 'en' : 'ko');
            const savedLang = targetLang || localStorage.getItem('guide_lang') || navLang;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', () => setGuideLanguage(btn.dataset.lang));
            });

                });
